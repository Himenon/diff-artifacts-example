name: Build Diff

on:
  pull_request:

jobs:
  compare-build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # PRにコメントを残すために必要

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/initialize
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - name: Install & Build (Current PR)
        run: |
          pnpm i --frozen-lockfile
          pnpm build


          # 1. Mainブランチ（PRのベース）の最新コミットハッシュを取得
      - name: Get base branch SHA
        id: base_info
        run: |
          # PRのベースブランチ（通常はmain）の最新ハッシュを取得
          SHA=$(git rev-parse origin/${{ github.base_ref }})
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          # 比較用に短縮版も作成
          echo "sha_short=$(echo $SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      # 2. 特定のハッシュ名を持つArtifactをダウンロード
      - name: Download Base Artifact
        id: download_step
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          # 前回のワークフローで保存した名前に合わせる
          name: build-main-${{ steps.base_info.outputs.sha_short }}
          path: .next-base

      # 3. Artifactが存在するかチェック
      - name: Check if base artifact exists
        id: check_artifact
        run: |
          if [ -d ".next-base" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Base artifact not found for SHA ${{ steps.base_info.outputs.sha_short }}. Skipping diff."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # 4. 比較（Artifactが存在する場合のみ実行）
      - name: Compare Build Artifacts
        if: steps.check_artifact.outputs.exists == 'true'
        id: diff
        run: |
          echo "--- Diff Report ---" > diff_report.txt
          # .next 内のハッシュ付きファイル名などの差異を比較
          diff -r .next-base .next > diff_result.txt || true
          
          if [ -s diff_result.txt ]; then
            echo "HAS_DIFF=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_DIFF=false" >> $GITHUB_OUTPUT
          fi

      # 5. 結果をコメント（差分がある場合のみ実行）
      - name: Post Diff Comment
        if: steps.check_artifact.outputs.exists == 'true' && steps.diff.outputs.HAS_DIFF == 'true'
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ### 🛠 Build Artifacts Diff Detected
            Base SHA: `${{ steps.base_info.outputs.sha_short }}`
            ```
            $(head -n 20 diff_result.txt)
            ```
