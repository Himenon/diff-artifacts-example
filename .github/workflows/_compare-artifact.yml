name: "Reusable Diff Logic"

on:
  workflow_call:
    inputs:
      pr_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      diff_viewer_repo:
        required: true
        type: string
        description: "Repository to push diff artifacts (e.g., 'owner/repo-diff-viewer')"
      gitignore_patterns:
        required: false
        type: string
        default: "node_modules/"
        description: "Gitignore patterns to exclude from diff (space-separated)"
      format_command:
        required: false
        type: string
        default: ""
        description: "Command to format artifacts before diffing (e.g., 'pnpm exec oxfmt')"
      enable_comment:
        required: false
        type: boolean
        default: true
        description: "Enable posting comment to PR with diff summary"
      base_dir:
        required: false
        type: string
        default: "artifact-base"
        description: "Directory path for base branch artifact"
      pr_dir:
        required: false
        type: string
        default: "artifact-pr"
        description: "Directory path for PR artifact"
      base_artifact_prefix:
        required: false
        type: string
        default: "build-main"
        description: "Artifact name prefix for base branch (e.g., 'build-main')"
      pr_artifact_prefix:
        required: false
        type: string
        default: "build-pr"
        description: "Artifact name prefix for PR branch (e.g., 'build-pr')"
      diff_viewer_owner:
        required: true
        type: string
        description: "Owner of the diff viewer repository"
      diff_viewer_repo_name:
        required: true
        type: string
        description: "Name of the diff viewer repository"
      base_workflow_file:
        required: false
        type: string
        default: "main.yml"
        description: "Workflow file name to find base branch artifacts"
    secrets:
      app_id:
        required: true
        description: "GitHub App ID"
      app_private_key:
        required: true
        description: "GitHub App Private Key"

jobs:
  diff:
    name: Compare Artifacts ${{ inputs.pr_sha }} vs Main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMMENT_MARKER: "<!-- build-artifacts-diff -->"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # 全履歴を取得するか、少なくともベースブランチと比較できる程度の履歴が必要
          fetch-depth: 0

      # 1. Generate GitHub App Token
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ inputs.diff_viewer_owner }}
          repositories: ${{ inputs.diff_viewer_repo_name }}

      # 2. Mainブランチの最新コミットハッシュ取得
      - name: Get base branch SHA
        id: base_info
        run: |
          SHA=$(git rev-parse origin/${{ inputs.base_ref }})
          echo "sha_short=$(echo $SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      # 3. Mainブランチの最新のワークフロー実行IDを取得
      - name: Get main branch workflow run ID
        id: main_run
        continue-on-error: true
        run: |
          RUN_ID=$(gh run list --branch ${{ inputs.base_ref }} --workflow ${{ inputs.base_workflow_file }} --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      # 4. MainのArtifactをダウンロード
      - name: Download Main Artifact
        id: download_main
        if: steps.main_run.outputs.run_id != ''
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: ${{ inputs.base_artifact_prefix }}-${{ steps.base_info.outputs.sha_short }}
          path: ${{ inputs.base_dir }}
          run-id: ${{ steps.main_run.outputs.run_id }}
          github-token: ${{ github.token }}

      # 5. 現在のPRのArtifactをダウンロード
      - name: "Download PR Artifact: ${{ inputs.pr_artifact_prefix }}-${{ inputs.pr_sha }}"
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.pr_artifact_prefix }}-${{ inputs.pr_sha }}
          path: ${{ inputs.pr_dir }}

      # 6. 比較
      - name: Compare Artifacts
        id: compare
        if: steps.download_main.outcome == 'success'
        env:
          COMMENT_MARKER: ${{ env.COMMENT_MARKER }}
          BASE_SHA_SHORT: ${{ steps.base_info.outputs.sha_short }}
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIFF_VIEWER_REPO: ${{ inputs.diff_viewer_repo }}
          BASE_DIR: ${{ inputs.base_dir }}
          PR_DIR: ${{ inputs.pr_dir }}
          GITIGNORE_PATTERNS: ${{ inputs.gitignore_patterns }}
          FORMAT_COMMAND: ${{ inputs.format_command }}
        run: ./scripts/compare-artifacts.sh

      # 7. コメント投稿（上書き）
      - name: Post Comment
        if: inputs.enable_comment == true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          DIFF_URL: ${{ steps.compare.outputs.DIFF_URL }}
          COMMENT_MARKER: ${{ env.COMMENT_MARKER }}
        run: |
          BODY=$(cat report.md)

          # DIFF_URLプレースホルダーを実際のURLに置換
          if [ -n "$DIFF_URL" ]; then
            DIFF_LINK="🔗 **View full diff: $DIFF_URL**"
            BODY="${BODY//\{\{DIFF_URL\}\}/$DIFF_LINK}"
          else
            # DIFF_URLがない場合はプレースホルダーを削除
            BODY="${BODY//\{\{DIFF_URL\}\}/}"
          fi

          # マーカーをコメントの最後に追加
          BODY="${BODY}"$'\n'"${COMMENT_MARKER}"

          # 既存のコメントを検索（マーカーで識別）
          COMMENT_ID=$(gh api repos/$GH_REPO/issues/$NUMBER/comments \
            --jq ".[] | select(.body | contains(\"$COMMENT_MARKER\")) | .id" \
            2>/dev/null | head -n 1)

          if [ -n "$COMMENT_ID" ]; then
            # 既存のコメントを更新
            if gh api repos/$GH_REPO/issues/comments/$COMMENT_ID -X PATCH -f body="$BODY" > /dev/null 2>&1; then
              echo "既存のコメント #$COMMENT_ID を更新しました"
              echo "Diff URL: $DIFF_URL"
            else
              echo "エラー: コメントの更新に失敗しました (Comment ID: $COMMENT_ID)"
              exit 1
            fi
          else
            # 新規コメントを作成
            if gh pr comment "$NUMBER" --body "$BODY" > /dev/null 2>&1; then
              echo "新規コメントを作成しました"
              echo "Diff URL: $DIFF_URL"
            else
              echo "エラー: コメントの作成に失敗しました (PR: $NUMBER)"
              exit 1
            fi
          fi
