name: "Reusable Diff Logic"

on:
  workflow_call:
    inputs:
      pr_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      gitignore_patterns:
        required: false
        type: string
        default: "node_modules/"
        description: "Gitignore patterns to exclude from diff (space-separated)"
    secrets:
      app_id:
        required: true
        description: "GitHub App ID"
      app_private_key:
        required: true
        description: "GitHub App Private Key"

jobs:
  diff:
    name: Compare Artifacts ${{ inputs.pr_sha }} vs Main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMMENT_MARKER: "<!-- build-artifacts-diff -->"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # 全履歴を取得するか、少なくともベースブランチと比較できる程度の履歴が必要
          fetch-depth: 0
      - uses: ./.github/actions/initialize
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile

      # 1. Generate GitHub App Token
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: Himenon
          repositories: compare-action-diff-viewer

      # 2. Mainブランチの最新コミットハッシュ取得
      - name: Get base branch SHA
        id: base_info
        run: |
          SHA=$(git rev-parse origin/${{ inputs.base_ref }})
          echo "sha_short=$(echo $SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      # 3. Mainブランチの最新のワークフロー実行IDを取得
      - name: Get main branch workflow run ID
        id: main_run
        continue-on-error: true
        run: |
          RUN_ID=$(gh run list --branch ${{ inputs.base_ref }} --workflow on-push-main.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      # 4. MainのArtifactをダウンロード
      - name: Download Main Artifact
        id: download_main
        if: steps.main_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-main-${{ steps.base_info.outputs.sha_short }}
          path: .next-base
          run-id: ${{ steps.main_run.outputs.run_id }}
          github-token: ${{ github.token }}

      # 5. 現在のPRのArtifactをダウンロード
      - name: "Download PR Artifact: build-pr-${{ inputs.pr_sha }}"
        uses: actions/download-artifact@v7
        with:
          name: build-pr-${{ inputs.pr_sha }}
          path: .next-pr

      # 6. 比較
      - name: Compare Artifacts
        id: compare
        if: steps.download_main.outcome == 'success'
        env:
          COMMENT_MARKER: ${{ env.COMMENT_MARKER }}
          BASE_SHA_SHORT: ${{ steps.base_info.outputs.sha_short }}
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIFF_VIEWER_REPO: Himenon/compare-action-diff-viewer
          BASE_DIR: .next-base
          PR_DIR: .next-pr
          GITIGNORE_PATTERNS: ${{ inputs.gitignore_patterns }}
        run: ./.github/scripts/compare-artifacts.sh

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
      # 7. コメント投稿（上書き）
      - name: Post Comment
        if: steps.compare.outputs.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          DIFF_URL: ${{ steps.compare.outputs.DIFF_URL }}
          COMMENT_MARKER: ${{ env.COMMENT_MARKER }}
        run: |
          BODY=$(cat report.md)

          # DIFF_URLが設定されていれば、コメントに追記
          if [ -n "$DIFF_URL" ]; then
            BODY="${BODY}"$'\n\n'"---"$'\n\n'"🔗 **View full diff**: $DIFF_URL"
          fi

          # マーカーをコメントの最後に追加
          BODY="${BODY}"$'\n'"${COMMENT_MARKER}"

          # 既存のコメントを検索（マーカーで識別）
          COMMENT_ID=$(gh api repos/$GH_REPO/issues/$NUMBER/comments \
            --jq ".[] | select(.body | contains(\"$COMMENT_MARKER\")) | .id" \
            2>/dev/null | head -n 1)

          if [ -n "$COMMENT_ID" ]; then
            # 既存のコメントを更新
            if gh api repos/$GH_REPO/issues/comments/$COMMENT_ID -X PATCH -f body="$BODY" > /dev/null 2>&1; then
              echo "既存のコメント #$COMMENT_ID を更新しました"
              echo "Diff URL: $DIFF_URL"
            else
              echo "エラー: コメントの更新に失敗しました (Comment ID: $COMMENT_ID)"
              exit 1
            fi
          else
            # 新規コメントを作成
            if gh pr comment "$NUMBER" --body "$BODY" > /dev/null 2>&1; then
              echo "新規コメントを作成しました"
              echo "Diff URL: $DIFF_URL"
            else
              echo "エラー: コメントの作成に失敗しました (PR: $NUMBER)"
              exit 1
            fi
          fi
