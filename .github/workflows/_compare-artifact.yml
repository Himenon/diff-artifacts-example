name: "Reusable Diff Logic"

on:
  workflow_call:
    inputs:
      pr_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string

jobs:
  diff:
    name: Compare Artifacts ${{ inputs.pr_sha }} vs Main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMMENT_MARKER: "<!-- build-artifacts-diff -->"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # 全履歴を取得するか、少なくともベースブランチと比較できる程度の履歴が必要
          fetch-depth: 0
      - uses: ./.github/actions/initialize
      # 1. Mainブランチの最新コミットハッシュ取得
      - name: Get base branch SHA
        id: base_info
        run: |
          SHA=$(git rev-parse origin/${{ inputs.base_ref }})
          echo "sha_short=$(echo $SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      # 2. Mainブランチの最新のワークフロー実行IDを取得
      - name: Get main branch workflow run ID
        id: main_run
        continue-on-error: true
        run: |
          RUN_ID=$(gh run list --branch ${{ inputs.base_ref }} --workflow on-push-main.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      # 3. MainのArtifactをダウンロード
      - name: Download Main Artifact
        id: download_main
        if: steps.main_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-main-${{ steps.base_info.outputs.sha_short }}
          path: .next-base
          run-id: ${{ steps.main_run.outputs.run_id }}
          github-token: ${{ github.token }}

      # 4. 現在のPRのArtifactをダウンロード
      - name: "Download PR Artifact: build-pr-${{ inputs.pr_sha }}"
        uses: actions/download-artifact@v7
        with:
          name: build-pr-${{ inputs.pr_sha }}
          path: .next-pr

      # 5. 比較
      - name: Compare Artifacts
        id: compare
        if: steps.download_main.outcome == 'success'
        run: |
          echo "$COMMENT_MARKER" > report.md
          echo "### 🛠 Build Artifacts Diff" >> report.md
          echo "Comparing \`main\` (${{ steps.base_info.outputs.sha_short }}) vs \`PR\` (${{ inputs.pr_sha }})" >> report.md
          echo "" >> report.md

          # ファイルレベルの差分を取得
          diff -rq .next-base .next-pr > diff_result.txt || true

          if [ -s diff_result.txt ]; then
            echo "HAS_DIFF=true" >> $GITHUB_OUTPUT

            # 統計情報を収集
            ADDED=$(grep "Only in .next-pr" diff_result.txt | wc -l)
            REMOVED=$(grep "Only in .next-base" diff_result.txt | wc -l)
            MODIFIED=$(grep "Files .* differ" diff_result.txt | wc -l)

            # サマリーを出力
            echo "#### Summary" >> report.md
            echo "- 🟢 Added: $ADDED files" >> report.md
            echo "- 🔴 Removed: $REMOVED files" >> report.md
            echo "- 🟡 Modified: $MODIFIED files" >> report.md
            echo "" >> report.md

            # Modified Filesの詳細
            if [ $MODIFIED -gt 0 ]; then
              echo "#### 🟡 Modified Files" >> report.md
              COUNT=0
              MAX_FILES=10
              grep "Files .* differ" diff_result.txt | head -n $MAX_FILES | while IFS= read -r line; do
                FILE1=$(echo "$line" | sed 's/Files \(.*\) and .* differ/\1/')
                FILE2=$(echo "$line" | sed 's/Files .* and \(.*\) differ/\1/')
                FILENAME=$(echo "$FILE2" | sed 's|.next-pr/||')

                echo "<details><summary><code>$FILENAME</code></summary>" >> report.md
                echo "" >> report.md
                echo "\`\`\`diff" >> report.md
                diff -u "$FILE1" "$FILE2" 2>/dev/null | sed 's|.next-base/||g; s|.next-pr/||g' | head -n 100 >> report.md || echo "Binary files differ or file too large" >> report.md
                echo "\`\`\`" >> report.md
                echo "</details>" >> report.md
                echo "" >> report.md
                COUNT=$((COUNT + 1))
              done
              if [ $MODIFIED -gt $MAX_FILES ]; then
                echo "_... and $((MODIFIED - MAX_FILES)) more modified files_" >> report.md
                echo "" >> report.md
              fi
            fi

            # Added Filesの詳細
            if [ $ADDED -gt 0 ]; then
              echo "#### 🟢 Added Files" >> report.md
              MAX_ADDED=20
              COUNT=0
              grep "Only in .next-pr" diff_result.txt | head -n $MAX_ADDED | while IFS= read -r line; do
                DIR=$(echo "$line" | sed 's/Only in \(.*\): .*/\1/' | sed 's|.next-pr||')
                FILE=$(echo "$line" | sed 's/Only in .*: //')
                FULLPATH=".next-pr${DIR}/${FILE}"
                FILEPATH="${DIR}/${FILE}"

                if [ -f "$FULLPATH" ]; then
                  SIZE=$(stat -f%z "$FULLPATH" 2>/dev/null || stat -c%s "$FULLPATH" 2>/dev/null || echo "unknown")
                  echo "- \`$FILEPATH\` (${SIZE} bytes)" >> report.md
                fi
                COUNT=$((COUNT + 1))
              done
              if [ $ADDED -gt $MAX_ADDED ]; then
                echo "_... and $((ADDED - MAX_ADDED)) more added files_" >> report.md
              fi
              echo "" >> report.md
            fi

            # Removed Filesの詳細
            if [ $REMOVED -gt 0 ]; then
              echo "#### 🔴 Removed Files" >> report.md
              MAX_REMOVED=20
              COUNT=0
              grep "Only in .next-base" diff_result.txt | head -n $MAX_REMOVED | while IFS= read -r line; do
                DIR=$(echo "$line" | sed 's/Only in \(.*\): .*/\1/' | sed 's|.next-base||')
                FILE=$(echo "$line" | sed 's/Only in .*: //')
                FULLPATH=".next-base${DIR}/${FILE}"
                FILEPATH="${DIR}/${FILE}"

                if [ -f "$FULLPATH" ]; then
                  SIZE=$(stat -f%z "$FULLPATH" 2>/dev/null || stat -c%s "$FULLPATH" 2>/dev/null || echo "unknown")
                  echo "- \`$FILEPATH\` (${SIZE} bytes)" >> report.md
                fi
                COUNT=$((COUNT + 1))
              done
              if [ $REMOVED -gt $MAX_REMOVED ]; then
                echo "_... and $((REMOVED - MAX_REMOVED)) more removed files_" >> report.md
              fi
              echo "" >> report.md
            fi
          else
            echo "HAS_DIFF=false" >> $GITHUB_OUTPUT
            echo "✅ No changes detected." >> report.md
          fi

      # 6. コメント投稿（上書き）
      - name: Post Comment
        if: steps.compare.outputs.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT_BODY=$(cat report.md)

          # 既存のコメントを検索
          EXISTING_COMMENT_ID=$(gh api \
            repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq ".[] | select(.body | contains(\"$COMMENT_MARKER\")) | .id" \
            | head -n 1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            # 既存のコメントを更新
            gh api \
              repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT_ID \
              -X PATCH \
              -f body="$COMMENT_BODY"
            echo "Updated existing comment: $EXISTING_COMMENT_ID"
          else
            # 新規コメントを作成
            gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT_BODY"
            echo "Created new comment"
          fi
