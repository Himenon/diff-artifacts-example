name: Build and Compare Artifacts on Pull Request

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/initialize
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Restore Next.js cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ${{ github.workspace }}/apps/nextjs14-project/.next/cache
            ${{ github.workspace }}/apps/nextjs15-project/.next/cache
            ${{ github.workspace }}/apps/nextjs16-project/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"
      - run: |
          pnpm i --frozen-lockfile
      - run: |
          pnpm build
          pnpm test
        env:
          CI_BUILD_ID: FIXED_CI_BUILD_ID

      - uses: Himenon/upload-diff-artifact@01b6cc722e631f4d071c525ba6b27c9c2b2885e2
        with:
          path: |
            apps/nextjs14-project/.next  
            apps/nextjs15-project/.next
            apps/nextjs16-project/.next

  diff-artifacts:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile

      - name: Diff Artifacts
        uses: Himenon/diff-artifact@110f5f82e26809919a37582e8c0f5be4099524cf
        with:
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          diff-viewer-owner: "Himenon"
          diff-viewer-repo-name: "diff-artifacts-example-diff-viewer"
          gitignore-patterns: |
            node_modules
            cache
            trace
            trace-build
          pre-push-shell: "pnpm exec oxfmt"
