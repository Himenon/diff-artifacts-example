name: Build and Compare Artifacts on Pull Request

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha-short: ${{ steps.vars.outputs.sha-short }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/initialize
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Restore Next.js cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ${{ github.workspace }}/apps/nextjs14-project/.next/cache
            ${{ github.workspace }}/apps/nextjs15-project/.next/cache
            ${{ github.workspace }}/apps/nextjs16-project/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"
      - run: |
          pnpm i --frozen-lockfile
      - run: |
          pnpm build
          pnpm test
        env:
          CI_BUILD_ID: FIXED_CI_BUILD_ID

      - uses: Himenon/upload-diff-artifact@bbd1d94347ec5d0cc2425d5a33d76c0c23fa0fe1
        id: vars
        with:
          name: custom-build-name
          path: |
            apps/nextjs14-project/.next  
            apps/nextjs15-project/.next
            apps/nextjs16-project/.next

  diff-artifacts:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile

      - name: Diff Artifacts
        uses: Himenon/diff-artifact@8478be9d63230c1bdc5f4928d1f09803792abf86
        with:
          github-token: ${{ github.token }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          pr-sha: ${{ needs.build.outputs.sha-short }}
          base-ref: ${{ github.base_ref }}
          diff-viewer-owner: "Himenon"
          diff-viewer-repo-name: "compare-action-diff-viewer"
          base-artifact-name: custom-build-name
          pr-artifact-name: "custom-build-name-${{ needs.build.outputs.sha-short }}"
          base-branch-prefix: custom-build-name
          base-artifact-path: ".diff-artifacts/base"
          pr-artifact-path: ".diff-artifacts/pr"
          pr-branch-prefix: custom-build-name
          gitignore-patterns: |
            node_modules
            cache
            trace
            trace-build
          pre-push-shell: "pnpm exec oxfmt"
          enable-comment: "true"
