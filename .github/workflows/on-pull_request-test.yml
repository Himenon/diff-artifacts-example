name: Build and Compare Artifacts on Pull Request

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/initialize
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Restore Next.js cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ${{ github.workspace }}/apps/nextjs16-project/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"
      - run: |
          cd apps/nextjs16-project
          pnpm i --frozen-lockfile
      - run: |
          pnpm build
          pnpm test
        env:
          CI_BUILD_ID: FIXED_CI_BUILD_ID
      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: "Upload build directory: build-pr-${{ steps.vars.outputs.sha_short }}"
        uses: actions/upload-artifact@v6
        with:
          name: build-pr-${{ steps.vars.outputs.sha_short }}
          path: apps/nextjs16-project/.next
          if-no-files-found: error
          include-hidden-files: true

  call-diff:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile

      - name: Compare Artifacts
        uses: Himenon/compare-artifact@ccfaf6955f8257b330142697e37d23e4635c9fe3
        with:
          github-token: ${{ github.token }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          pr-sha: ${{ needs.build.outputs.sha_short }}
          base-ref: ${{ github.base_ref }}
          diff-viewer-repo: "Himenon/compare-action-diff-viewer"
          diff-viewer-owner: "Himenon"
          diff-viewer-repo-name: "compare-action-diff-viewer"
          base-artifact-name: "build-main"
          pr-artifact-name: "build-pr-${{ needs.build.outputs.sha_short }}"
          base-artifact-path: ".next-base"
          pr-artifact-path: ".next-pr"
          base-workflow-name: "on-push-main.yml"
          gitignore-patterns: |
            node_modules
            cache
            trace
            trace-build
          format-command: "pnpm exec oxfmt"
          enable-comment: "true"
