name: Build & Push Diff Artifact

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/initialize
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Restore Next.js cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ${{ github.workspace }}/apps/nextjs14-project/.next/cache
            ${{ github.workspace }}/apps/nextjs15-project/.next/cache
            ${{ github.workspace }}/apps/nextjs16-project/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
        env:
          CI_BUILD_ID: FIXED_CI_BUILD_ID
      - uses: Himenon/diff-artifact/upload@v1.1.0
        with:
          path: |
            apps/nextjs14-project/.next
            apps/nextjs15-project/.next
            apps/nextjs16-project/.next
